# 北京长盈鑫科技 · 电商站点 一键编排
# 默认（DB_DRIVER=json）仅启动 app；如需「云端数据库」，把 .env 里 DB_DRIVER 设为 postgres 即可启用内置 PostgreSQL。
services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-me}
      - DB_DRIVER=${DB_DRIVER:-json}
      - PG_CONNECTION_STRING=${PG_CONNECTION_STRING:-postgres://cyx:cyx_password@db:5432/cyx_shop}
      - PG_SSL=${PG_SSL:-false}
      - STORAGE_DRIVER=${STORAGE_DRIVER:-local}
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_REGION=${COS_REGION:-}
      - UPLOAD_PUBLIC_BASE=${UPLOAD_PUBLIC_BASE:-}
    volumes:
      # 本地模式的数据兜底卷；postgres 模式下这两个卷可省略，但保留更稳妥
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=cyx
      - POSTGRES_PASSWORD=cyx_password
      - POSTGRES_DB=cyx_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyx -d cyx_shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
