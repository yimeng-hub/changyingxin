# 北京长盈鑫科技 · Nginx 反向代理配置
# 放置位置：/etc/nginx/conf.d/changyingxin.conf
# 使用前请把 server_name 与 alias 路径改成你的实际域名和项目路径

upstream cyx_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------- HTTP（先用这个跑通，再上 HTTPS）----------
server {
    listen 80;
    listen [::]:80;
    server_name www.example.com example.com;

    # 允许后台上传较大图片
    client_max_body_size 20m;

    # 访问日志
    access_log /var/log/nginx/changyingxin.access.log;
    error_log  /var/log/nginx/changyingxin.error.log;

    # 压缩
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 用户上传的图片：由 Nginx 直出，速度更快、不占 Node
    location /uploads/ {
        alias /var/www/changyingxin/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # 前端静态资源
    location ~* ^/(css|js)/ {
        root /var/www/changyingxin/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 其余请求交给 Node
    location / {
        proxy_pass http://cyx_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

